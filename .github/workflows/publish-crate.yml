name: Publish crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish --dry-run instead of publishing
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-crate
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  quality:
    name: Quality gate for the selected commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: quality
    name: Publish g3-ui
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A crate that builds only with a [patch] is broken for everyone who
      # installs it: crates.io drops the patch. While g3-ui patches in the
      # Dioxus fork, a dry run warns and a real publish stops here.
      - name: Refuse to publish with [patch] sections
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*\[patch[].]' Cargo.toml; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "::warning file=Cargo.toml::Cargo.toml has a [patch] section; a real publish would stop here."
            else
              echo "::error file=Cargo.toml::Cargo.toml has a [patch] section (above). Remove it, and every dependency that needs it, before publishing."
              exit 1
            fi
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Authenticate with crates.io
        if: ${{ !inputs.dry_run }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [[ "${DRY_RUN}" == "true" ]]; then
            cargo publish --dry-run
            exit 0
          fi

          cargo publish
