name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks and tests
    runs-on: [self-hosted, linux, g3-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check component library
        run: cargo check

      - name: Run component tests
        run: cargo test

      - name: Check transition integration
        run: cargo check --features transitions

      - name: Run transition integration tests
        run: cargo test --features transitions

      - name: Check playground
        run: cargo check --manifest-path playground/Cargo.toml

      - name: Check whitespace
        run: git diff --check
