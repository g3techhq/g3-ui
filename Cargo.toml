[package]
name = "g3-ui"
version = "0.6.0"

edition = "2024"
rust-version = "1.88"
resolver = "2"
description = "Mobile-first Dioxus component library inspired by Ionic."
repository = "https://github.com/g3techhq/g3-ui"
readme = "README.md"
documentation = "https://docs.rs/g3-ui"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "ui", "components", "mobile"]
categories = ["gui", "wasm", "web-programming"]
include = ["/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/src/**", "/assets/**"]

[lib]
name = "g3_ui"
path = "src/lib.rs"

[features]
playground = []
transitions = ["dep:g3-route-transitions"]

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["router"] }
dioxus-icons = "=0.2.0-alpha.3"
dioxus-sdk-time = "=0.8.0-alpha.3"
cfg-if = "1.0.0"
manganis = "=0.8.0-alpha.3"
serde = { version = "1.0", default-features = false }
g3-route-transitions = { version = "0.5", optional = true }

[dev-dependencies]
dioxus-ssr = "=0.8.0-alpha.3"
dioxus-html = { version = "=0.8.0-alpha.3", features = ["serialize"] }
tokio = { version = "1.48", features = ["rt", "macros", "time", "test-util"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.103"
web-sys = { version = "0.3.102", features = ["Document", "DomTokenList", "HtmlElement", "Navigator", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[package.metadata.docs.rs]
features = ["transitions"]
rustdoc-args = ["--cfg", "docsrs"]

[patch.crates-io]
# Dioxus fork (upstream main + g3 commits; see G3-PATCHES.md there). Local
# builds use the sibling checkouts via Projects/.cargo/config.toml.
dioxus = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-html = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-ssr = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
manganis = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# dioxus-icons asks crates.io for these three; the template crate exists only
# under its post-rename name, which is not published.
dioxus-signals = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-vdom-template = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
lazy-js-bundle = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-icons = { git = "https://github.com/Gateway3B/dioxus-icons", branch = "main" }
# dioxus-sdk-time 0.8.0-alpha.3 on crates.io still reaches into
# `dioxus::dioxus_core`, which the fork no longer has.
dioxus-sdk-time = { git = "https://github.com/Gateway3B/sdk", branch = "main" }
# g3 crates are not published until Dioxus 0.8.0:
g3-route-transitions = { git = "https://github.com/g3techhq/g3-route-transitions", branch = "main" }
