[package]
name = "g3-ui-playground"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["web"] }
dioxus-code = { version = "=0.2.0-alpha.3", features = ["runtime", "lang-toml"] }
dioxus-icons = "=0.2.0-alpha.3"
g3-route-transitions = "0.5"
g3-ui = { path = "..", features = ["playground", "transitions"] }
gloo-timers = { version = "0.3", features = ["futures"] }
manganis = "=0.8.0-alpha.3"

[build-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
syn = { version = "2", features = ["full"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[target.wasm32-unknown-unknown.dependencies]
# Read the shell breakpoint during the first render. The media-query eval that
# keeps it up to date cannot answer until after that render, and the drawer has
# to be laid out correctly before the page is first painted, not animated into
# place afterwards.
web-sys = { version = "0.3.102", features = ["MediaQueryList", "Window"] }

[target.wasm32-unknown-unknown.dependencies.getrandom_v03]
package = "getrandom"
version = "0.3.3"
features = ["wasm_js"]

[target.wasm32-unknown-unknown.dependencies.getrandom_v02]
package = "getrandom"
version = "0.2"
features = ["js"]

# The playground is its own workspace root, so it needs the same patches as
# the library (`[patch]` only applies at the root).
[patch.crates-io]
# Dioxus fork (upstream main + g3 commits; see G3-PATCHES.md there). Local
# builds use the sibling checkouts via Projects/.cargo/config.toml.
dioxus = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
manganis = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
# dioxus-icons asks crates.io for these three; the template crate exists only
# under its post-rename name, which is not published.
dioxus-signals = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-vdom-template = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
lazy-js-bundle = { git = "https://github.com/Gateway3B/dioxus", branch = "main" }
dioxus-icons = { git = "https://github.com/Gateway3B/dioxus-icons", branch = "main" }
# dioxus-sdk-time 0.8.0-alpha.3 on crates.io still reaches into
# `dioxus::dioxus_core`, which the fork no longer has.
dioxus-sdk-time = { git = "https://github.com/Gateway3B/sdk", branch = "main" }
# g3 crates are not published until Dioxus 0.8.0:
g3-route-transitions = { git = "https://github.com/g3techhq/g3-route-transitions", branch = "main" }
