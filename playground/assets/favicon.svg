<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="g3-ui">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b8dfb" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- An app tile holding a stack of rows: the shape the library makes. Three
       bars is the most detail that still separates at 16px, so there are no
       smaller marks to lose. -->
  <rect width="64" height="64" rx="15" fill="url(#tile)" />
  <rect x="14" y="15" width="36" height="9" rx="4.5" fill="#ffffff" />
  <rect x="14" y="29" width="36" height="9" rx="4.5" fill="#ffffff" opacity="0.6" />
  <rect x="14" y="43" width="22" height="9" rx="4.5" fill="#ffffff" opacity="0.6" />
</svg>
