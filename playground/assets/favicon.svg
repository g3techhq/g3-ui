<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="g3-ui">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b8dfb" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)" />
  <!--
    The switchblade g3, on its own 110 x 64 grid: one stroke weight, right
    angles throughout, and a top bar that runs unbroken from the G into the 3,
    which is what joins the two glyphs. The corners fillet from the stroke's
    round joins rather than from drawn radii, so they stay true at every size.

    The stroke is 13 of 64, which leaves the gaps between the three horizontals
    a little narrower than the strokes themselves - any heavier and the
    counters close up at tab size and the mark reads as a solid block.
  -->
  <g transform="translate(6.22 17) scale(0.46875)"
     fill="none" stroke="#ffffff" stroke-width="13"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- Top bar, the G, and its tongue. -->
    <path d="M 103.5 6.5 L 6.5 6.5 L 6.5 57.5 L 52 57.5 L 52 32 L 32 32" />
    <!-- The 3's spine and foot. -->
    <path d="M 103.5 6.5 L 103.5 57.5 L 76 57.5" />
    <!-- The 3's waist. -->
    <path d="M 76 32 L 103.5 32" />
  </g>
</svg>
